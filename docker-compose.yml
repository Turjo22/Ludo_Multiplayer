version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ludo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ludo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ludo_user
      POSTGRES_PASSWORD: ludo_secure_password_replace_in_prod
      POSTGRES_DB: ludo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/src/storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludo_user -d ludo_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ludo-server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://ludo_user:ludo_secure_password_replace_in_prod@postgres:5432/ludo_db
      FRONTEND_URL: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ludo-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
